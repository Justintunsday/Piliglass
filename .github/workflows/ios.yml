name: Build iOS Native UI

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "Packages/AetherEngine/**"
      - "Packages/PiliHTTPTransport/**"
      - "Packages/PiliHTTPBodyCodec/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/check_native_danmaku.py"
      - "tool/check_native_settings.py"
      - "tool/native_migration_inventory.py"
      - "tool/check_ios_localization.py"
      - "tool/ios_native_sources.py"
      - "tool/check_native_search.py"
      - "tool/check_native_search.swift"
      - "tool/check_native_http.py"
      - "tool/check_native_http.swift"
      - "tool/check_native_request_context.py"
      - "tool/check_native_request_context.swift"
      - "tool/check_prepared_http_policy.py"
      - "tool/check_prepared_http_policy.swift"
      - "tool/prepared_http_policy_fixture.swift"
      - "tool/check_native_http_transfer.py"
      - "tool/check_native_http_transfer.swift"
      - "tool/check_native_cookie_wire.py"
      - "tool/check_native_cookie_wire.swift"
      - "tool/check_response_cookie_headers.dart"
      - "tool/check_account_request_state.dart"
      - "test/utils/accounts/**"
      - "test/http/**"
      - "test/services/native_login/**"
      - "test/utils/native_*"
      - "tool/check_native_http_execution*"
      - "tool/check_native_raw_http.py"
      - "tool/check_native_signing*"
      - "tool/check_native_accounts*"
      - "tool/check_native_login*"
      - "tool/check_native_body_codec.py"
      - "tool/check_native_cookie_store*"
      - "tool/check_native_cookies*"
      - "tool/native_raw_http2_probe.py"
      - "tool/native_login_synthetic_rsa.json"
      - "tool/native_app_signing_release_golden.dart"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "Packages/AetherEngine/**"
      - "Packages/PiliHTTPTransport/**"
      - "Packages/PiliHTTPBodyCodec/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/check_native_danmaku.py"
      - "tool/check_native_settings.py"
      - "tool/native_migration_inventory.py"
      - "tool/check_ios_localization.py"
      - "tool/ios_native_sources.py"
      - "tool/check_native_search.py"
      - "tool/check_native_search.swift"
      - "tool/check_native_http.py"
      - "tool/check_native_http.swift"
      - "tool/check_native_request_context.py"
      - "tool/check_native_request_context.swift"
      - "tool/check_prepared_http_policy.py"
      - "tool/check_prepared_http_policy.swift"
      - "tool/prepared_http_policy_fixture.swift"
      - "tool/check_native_http_transfer.py"
      - "tool/check_native_http_transfer.swift"
      - "tool/check_native_cookie_wire.py"
      - "tool/check_native_cookie_wire.swift"
      - "tool/check_response_cookie_headers.dart"
      - "tool/check_account_request_state.dart"
      - "test/utils/accounts/**"
      - "test/http/**"
      - "test/services/native_login/**"
      - "test/utils/native_*"
      - "tool/check_native_http_execution*"
      - "tool/check_native_raw_http.py"
      - "tool/check_native_signing*"
      - "tool/check_native_accounts*"
      - "tool/check_native_login*"
      - "tool/check_native_body_codec.py"
      - "tool/check_native_cookie_store*"
      - "tool/check_native_cookies*"
      - "tool/native_raw_http2_probe.py"
      - "tool/native_login_synthetic_rsa.json"
      - "tool/native_app_signing_release_golden.dart"
      - ".github/workflows/ios.yml"
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

concurrency:
  group: piliglass-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-request-context-core:
    name: Verify native request context contracts with Swift 6
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile and verify production context, codec and cancellation cleanup
        run: python3 tool/check_native_request_context.py
      - name: Upload native request context evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-request-context-contracts
          path: build/native-request-context-check/
          if-no-files-found: warn
  native-http-core:
    name: Verify native HTTP contracts with Swift 6
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile and verify production HTTP and trending service
        run: python3 tool/check_native_http.py
      - name: Verify capability routing and head-time one-shot execution
        run: python3 tool/check_native_http_execution.py
      - name: Upload native HTTP contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-http-contracts
          path: |
            build/native-http-check/
            build/native-http-execution-check/
          if-no-files-found: warn
  native-raw-http:
    name: Compare real Dart and raw Native wire and build iOS16 package
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache: true
      - name: Prepare Flutter fixture dependencies
        run: flutter pub get
      - name: Cache candidate Swift package artifacts
        uses: actions/cache@v5
        with:
          path: |
            Packages/PiliHTTPTransport/.build
            ~/Library/Caches/org.swift.swiftpm
          key: native-raw-http-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Packages/PiliHTTPTransport/Package.swift', 'Packages/PiliHTTPTransport/Package.resolved') }}
      - name: Actual field, cancellation, idle and device/simulator comparison
        run: python3 tool/check_native_raw_http.py
      - name: Actual TLS ALPN, HTTP2 field order, trust and HTTP11 fallback
        run: python3 tool/native_raw_http2_probe.py
      - name: Upload raw transport acceptance evidence and resolved dependencies
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-http-contracts
          path: |
            build/native-raw-http-check/*.json
            build/native-raw-http-check/*.log
            build/native-raw-http-check/Package.resolved
            build/native-raw-http2-check/*.json
            build/native-raw-http2-check/*.log
          if-no-files-found: warn
  native-search-core:
    name: Verify native search contracts with Swift 6
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile and verify production search core
        run: python3 tool/check_native_search.py
      - name: Upload native search contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-search-contracts
          path: build/native-search-check/
          if-no-files-found: warn
  build-macos-app:
    name: Build SwiftUI root + Flutter features
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache: true

      - name: Record native toolchain and migration inventory
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          python3 tool/native_migration_inventory.py

      - name: Cache CocoaPods downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Runner.xcodeproj/project.pbxproj', 'ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache DerivedData (incremental rebuild)
        uses: actions/cache@v5
        with:
          path: build/ios/DerivedData
          key: ios-derived-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Runner.xcodeproj/project.pbxproj', 'ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'pubspec.lock') }}
          restore-keys: |
            ios-derived-${{ runner.os }}-${{ runner.arch }}-

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Verify playback sources and latency selection
        run: |
          dart tool/check_native_playback_source.dart
          dart tool/check_native_cdn_latency.dart

      - name: Verify actual Dart HTTP policy and pool installation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/effective-http-policy
          dart analyze --fatal-infos lib/http/init.dart lib/http/effective_http_policy.dart lib/http/retry_interceptor.dart lib/services/native_http/ test/http/ test/utils/accounts/account_test_storage.dart | tee build/effective-http-policy/analyze.log
          flutter test --no-pub --reporter expanded test/http/ | tee build/effective-http-policy/flutter-test.log

      - name: Verify actual Dart policy leases with production Swift codec and provider
        run: python3 tool/check_prepared_http_policy.py

      - name: Verify native signing and WBI cache against actual Dart implementations
        run: python3 tool/check_native_signing.py

      - name: Verify raw gzip, Brotli and malformed UTF8 against actual Dart pipeline
        run: python3 tool/check_native_body_codec.py

      - name: Upload decoder comparison and iOS16 C dependency builds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-body-codec-contracts
          path: |
            build/native-body-codec-check/*.json
            build/native-body-codec-check/*.log
            build/native-body-codec-check/Package.resolved
          if-no-files-found: warn

      - name: Upload signer and key-cache comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-signing-contracts
          path: build/native-signing-check/
          if-no-files-found: warn

      - name: Upload prepared policy and cross-language evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prepared-http-policy-contracts
          path: build/prepared-http-policy/
          if-no-files-found: warn

      - name: Upload effective HTTP policy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: effective-http-policy-contracts
          path: build/effective-http-policy/
          if-no-files-found: warn

      - name: Verify production HTTP transfer lifecycle and header finalization
        run: python3 tool/check_native_http_transfer.py

      - name: Upload native HTTP transfer and wire evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-http-transfer-contracts
          path: build/native-http-transfer-check/
          if-no-files-found: warn

      - name: Verify account generations and response ownership
        shell: bash
        run: |
          mkdir -p build/account-request-state
          set -o pipefail
          dart analyze --fatal-infos lib/utils/accounts/account_request_state.dart lib/utils/accounts.dart lib/utils/accounts/account.dart lib/utils/accounts/account_manager/account_mgr.dart lib/services/native_http/ lib/services/native_accounts/ tool/check_account_request_state.dart test/utils/accounts/ | tee build/account-request-state/analyze.log
          dart tool/check_account_request_state.dart | tee build/account-request-state/runtime.log
          flutter test --no-pub --reporter expanded test/utils/accounts/ | tee build/account-request-state/flutter-test.log

      - name: Verify four-purpose account snapshots and Keychain shadow restart
        run: python3 tool/check_native_accounts.py
      - name: Verify Cookie parse and selection against actual Dart CookieJar
        run: python3 tool/check_native_cookies.py

      - name: Upload actual account export and Native staging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-account-contracts
          path: |
            build/native-account-contracts/
            build/native-cookie-contracts/
          if-no-files-found: warn

      - name: Verify actual login, RSA and single-writer contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/native-login-contract
          dart analyze --fatal-infos lib/services/native_login/ test/services/native_login/ | tee build/native-login-contract/analyze.log
          flutter test --no-pub --reporter expanded test/services/native_login/native_login_contract_test.dart | tee build/native-login-contract/dart-test.log
          python3 tool/check_native_login.py

      - name: Upload native login and account authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-login-contracts
          path: build/native-login-contract/
          if-no-files-found: warn

      - name: Upload account lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: account-request-state-contracts
          path: build/account-request-state/
          if-no-files-found: warn

      - name: Observe Darwin Cookie headers and cancellation lifecycle
        run: python3 tool/check_native_cookie_wire.py

      - name: Verify shared response Cookie parser against wire evidence
        shell: bash
        run: |
          mkdir -p build/response-cookie-check
          dart analyze lib/utils/accounts/account_manager/response_cookie_headers.dart tool/check_response_cookie_headers.dart | tee build/response-cookie-check/analyze.log
          dart tool/check_response_cookie_headers.dart build/native-cookie-wire/report.json | tee build/response-cookie-check/runtime.log

      - name: Upload Cookie representation and parser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cookie-response-contracts
          path: |
            build/native-cookie-wire/
            build/response-cookie-check/
          if-no-files-found: warn

      - name: Verify native danmaku settings with isolated accounts
        run: python3 tool/check_native_danmaku.py
      - name: Verify current native settings and reject obsolete options
        run: python3 tool/check_native_settings.py

      - name: Verify English and Chinese localization
        run: python3 tool/check_ios_localization.py

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub --verbose
          runner_binary="build/ios/iphoneos/Runner.app/Runner"
          aether_ffmpeg_order="$(otool -L "$runner_binary" | grep -n '/Libavcodec.framework/' | head -1 | cut -d: -f1)"
          legacy_ffmpeg_order="$(otool -L "$runner_binary" | grep -n '/Avcodec.framework/' | head -1 | cut -d: -f1)"
          if [ -z "$aether_ffmpeg_order" ] || [ -z "$legacy_ffmpeg_order" ]; then
            echo "Unable to verify the two FFmpeg runtimes in Runner"
            exit 1
          fi
          if [ "$aether_ffmpeg_order" -ge "$legacy_ffmpeg_order" ]; then
            echo "Aether FFmpeg is linked after media-kit FFmpeg; refusing a CoreMedia-unsafe IPA"
            otool -L "$runner_binary" | grep -E '/(Lib)?Avcodec.framework/'
            exit 1
          fi
          echo "Verified Aether FFmpeg precedes media-kit FFmpeg in Mach-O load order"
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus_ios_${{env.version}}.ipa Payload/Runner.app

      - name: Restore cache-safe Flutter dependencies
        if: always()
        shell: pwsh
        run: |
          git -C $env:FLUTTER_ROOT reset --hard HEAD
          git -C $env:FLUTTER_ROOT clean -fd
          if ($env:PUB_CACHE) {
            $pubHosted = Join-Path $env:PUB_CACHE 'hosted/pub.dev'
            if (Test-Path -LiteralPath $pubHosted) {
              Get-ChildItem -LiteralPath $pubHosted -Directory |
                Where-Object { $_.Name -like 'material_ui-*' -or $_.Name -like 'cupertino_ui-*' } |
                Remove-Item -Recurse -Force
            }
          }

      - name: Release
        # Inputs context is only bound for workflow_call; standalone push runs
        # treat this as empty and skip the release step.
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ startsWith(inputs.tag, 'nightly-') }}
          generate_release_notes: true
          files: |
            PiliPlus_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: PiliPlus_ios_*.ipa

      - name: Upload migration source inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-migration-inventory
          path: build/native-migration/*.json
          if-no-files-found: warn
