name: Preview iOS home layout

on:
  push:
    paths:
      - "ios/Runner/PiliNativeRootViewController.swift"
      - "ios/Runner/PiliNativePlayer.swift"
      - "tool/preview_ios_home.py"
      - "tool/preview_ios_navigation.py"
      - "tool/check_ios_video_load.py"
      - "tool/check_ios_player_controls.py"
      - ".github/workflows/ios-home-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Render production home views with offline fixtures
        run: python3 tool/preview_ios_home.py
      - name: Test menu pushes and interactive back gestures
        run: python3 tool/preview_ios_navigation.py
      - name: Check dense danmaku and lazy comment rendering
        run: python3 tool/check_ios_video_load.py
      - name: Upload video load check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-video-load-check
          path: |
            build/video-load-check/*.json
            build/video-load-check/*.png
          if-no-files-found: warn

      - name: Upload screenshots and layout measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-home-preview
          path: |
            build/home-preview/*.png
            build/home-preview/*.json
          if-no-files-found: warn
      - name: Upload menu navigation test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-menu-navigation
          path: |
            build/navigation-preview/xcodebuild.log
            build/navigation-preview/MenuNavigation.xcresult
            build/navigation-preview/attachments
          if-no-files-found: warn

  player-controls:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check native player gestures and landscape layout
        run: python3 tool/check_ios_player_controls.py
      - name: Upload player gesture tests and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-player-controls
          path: |
            build/player-controls-preview/xcodebuild.log
            build/player-controls-preview/MenuNavigation.xcresult
            build/player-controls-preview/attachments
          if-no-files-found: warn
